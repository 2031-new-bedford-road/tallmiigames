<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>404 — Not Found</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #000; color: #f5d27a; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    main { width: min(100%, 900px); text-align: center; }
    img { display: block; width: 100%; height: auto; max-height: calc(100vh - 48px); object-fit: contain; margin: 0 auto; }
    a { display: inline-block; margin-top: 18px; color: #f5d27a; font: 600 16px Arial, sans-serif; text-decoration: none; border: 1px solid #8b6a2c; padding: 12px 20px; border-radius: 6px; }
    a:hover { background: #171108; }
  </style>
</head>
<body>
  <main>
    <img src="images/404.jpg" alt="You've met with a terrible fate, haven't you? 404 Not Found">
    <a href="./">Return to homepage</a>
  </main>
</body>
</html>
