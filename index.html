<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#123b25">
<title>Tallmii Games</title>
<style>
:root{color-scheme:dark;--bg:#0b160e;--green:#39c66b;--panel:#14251a;--line:#2b5638}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:#effff2;font:15px/1.5 system-ui,Segoe UI,sans-serif}
main{max-width:1100px;margin:auto;padding:38px 22px}
.brand{display:inline-flex;align-items:center;gap:12px;font-weight:900;letter-spacing:1px;text-decoration:none;color:#effff2}
.logo{display:grid;place-items:center;width:42px;height:42px;border-radius:8px;background:var(--green);color:#06200e;font-size:23px}
.brand:hover span:last-child{color:var(--green)}
h1{font-size:clamp(36px,7vw,60px);line-height:1.05;margin:54px 0 10px;letter-spacing:-2px}
h1 span{color:var(--green)}
p{color:#a9c6b0;margin:0 0 24px}
.nav-buttons{display:flex;flex-wrap:wrap;gap:12px;margin:0 0 38px}
.hub-button{display:inline-block;padding:12px 18px;border-radius:9px;background:#39c66b;color:#06200e;text-decoration:none;font-weight:900}
.hub-button.secondary{background:#1c432a;color:#effff2;border:1px solid #326b43}
.hub-button:hover{filter:brightness(1.12)}
h2{font-size:17px;margin:0 0 16px}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:18px}
.game{aspect-ratio:1/1;display:flex;flex-direction:column;overflow:hidden;text-decoration:none;color:#effff2;background:var(--panel);border:1px solid var(--line);border-radius:12px;transition:transform .15s,border-color .15s}
.game:hover{transform:translateY(-3px);border-color:var(--green)}
.game img{display:block;width:100%;height:72%;object-fit:contain;padding:8px;background:#203b28}
.game-info{padding:10px 13px;display:flex;flex-direction:column;justify-content:center;flex:1}
.name{font-size:17px;font-weight:800}
.tag{font-size:12px;color:#a9c6b0}
footer{margin-top:48px;color:#789580;font-size:12px}
</style>
</head>
<body><main>
<header><a class="brand" href="n64hub.html" aria-label="Open N64Hub"><span class="logo">T</span><span>TALLMII GAMES</span></a></header>
<h1>Choose a <span>game.</span></h1>
<p>Browse the game library, or visit the Nintendo 64 collection and ROM downloads.</p>
<nav class="nav-buttons" aria-label="Game sections">
<a class="hub-button" href="n64hub.html">Go to N64Hub →</a>
<a class="hub-button secondary" href="roms.html">Browse ROMs →</a>
</nav>
<section aria-label="Games"><h2>GAME LIBRARY</h2><div class="games">
<a class="game" href="geo.html"><img src="images.jpg" alt="Geometry Dash game icon"><span class="game-info"><span class="name">Geometry Dash</span><span class="tag">Explore the world</span></span></a>
</div></section>
<footer>© Tallmii Games</footer>
</main></body></html>
