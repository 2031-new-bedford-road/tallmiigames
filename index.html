<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123b25">
<title>Tallmii Games</title>
<style>
:root{color-scheme:dark;--bg:#0b160e;--green:#39c66b;--panel:#14251a;--line:#2b5638}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:#effff2;font:15px/1.5 system-ui,Segoe UI,sans-serif}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px max(22px,calc((100vw - 1100px)/2));background:#14251a;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:1px;text-decoration:none;color:#effff2;white-space:nowrap}.logo{display:grid;place-items:center;width:38px;height:38px;border-radius:8px;background:var(--green);color:#06200e;font-size:21px}
nav{display:flex;gap:9px;flex-wrap:wrap}.navlink{padding:9px 14px;border:1px solid #326b43;border-radius:8px;background:#1c432a;color:#effff2;text-decoration:none;font-weight:800;font-size:13px}.navlink:hover{border-color:var(--green);background:#245b36}
main{max-width:1100px;margin:auto;padding:42px 22px}h1{font-size:clamp(36px,7vw,60px);line-height:1.05;margin:18px 0 10px;letter-spacing:-2px}h1 span{color:var(--green)}p{color:#a9c6b0;margin:0 0 30px}
h2{font-size:17px;margin:0 0 16px}.section{margin-top:36px}.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:18px}
.game{aspect-ratio:1/1;display:flex;flex-direction:column;overflow:hidden;text-decoration:none;color:#effff2;background:var(--panel);border:1px solid var(--line);border-radius:12px;transition:transform .15s,border-color .15s}.game:hover{transform:translateY(-3px);border-color:var(--green)}
.game img{display:block;width:100%;height:72%;object-fit:contain;padding:8px;background:#203b28}.game-info{padding:10px 13px;display:flex;flex-direction:column;justify-content:center;flex:1}.name{font-size:17px;font-weight:800}.tag{font-size:12px;color:#a9c6b0}
.recent-empty{padding:18px;border:1px dashed #326b43;border-radius:10px;color:#91ad98;background:#101e14}.recent-card{display:flex;align-items:center;gap:12px;padding:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:#effff2;text-decoration:none}.recent-card img{width:58px;height:58px;object-fit:contain;background:#203b28;border-radius:7px}.recent-card strong{display:block}.recent-card small{color:#a9c6b0}
footer{margin-top:48px;color:#789580;font-size:12px}
@media(max-width:520px){.topbar{align-items:flex-start;flex-direction:column}.topbar nav{width:100%}.navlink{flex:1;text-align:center}main{padding-top:30px}}
</style></head><body>
<header class="topbar"><a class="brand" href="index.html"><span class="logo">T</span><span>TALLMII GAMES</span></a><nav aria-label="Main menu"><a class="navlink" href="n64hub.html">N64Hub</a><a class="navlink" href="roms.html">ROMs</a></nav></header>
<main>
<h1>Choose a <span>game.</span></h1><p>Browse the game library, or visit the Nintendo 64 collection and ROM downloads.</p>
<section class="section" aria-label="Recently played"><h2>RECENTLY PLAYED</h2><div id="recent-games" class="games"><div class="recent-empty">Your recently played games will show up here.</div></div></section>
<section class="section" aria-label="Games"><h2>GAME LIBRARY</h2><div class="games">
<a class="game" href="geo.html" data-game="Geometry Dash" data-image="images.jpg"><img src="images.jpg" alt="Geometry Dash game icon"><span class="game-info"><span class="name">Geometry Dash</span><span class="tag">Explore the world</span></span></a>
</div></section>
<footer>© Tallmii Games</footer>
</main>
<script>
document.querySelectorAll('a[data-game]').forEach(a=>a.addEventListener('click',()=>{try{const key='tallmiiRecentlyPlayed';let list=JSON.parse(localStorage.getItem(key)||'[]');list=[{name:a.dataset.game,url:a.href,image:a.dataset.image},...list.filter(x=>x.name!==a.dataset.game)].slice(0,8);localStorage.setItem(key,JSON.stringify(list))}catch(e){}}));
(function(){
const key='tallmiiRecentlyPlayed';
const area=document.getElementById('recent-games');
let items=[];try{items=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){}
if(items.length){area.innerHTML='';items.slice(0,4).forEach(item=>{const a=document.createElement('a');a.className='recent-card';a.href=item.url;const img=document.createElement('img');img.src=item.image;img.alt='';const info=document.createElement('span');const name=document.createElement('strong');name.textContent=item.name;const small=document.createElement('small');small.textContent='Recently played';info.append(name,small);a.append(img,info);area.append(a)})}
})();
</script></body></html>
