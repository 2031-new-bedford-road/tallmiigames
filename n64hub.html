<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#123b25">\n<script src="./coi_serviceworker.js"></script>
<title>N64Hub · Tallmii Games</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#0b160e;color:#effff2;font:15px/1.5 system-ui,Segoe UI,sans-serif}
header{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 22px;background:#14251a;border-bottom:1px solid #2b5638}
.brand{font-weight:900;letter-spacing:1px;color:#effff2;text-decoration:none}
.nav{display:flex;gap:9px;flex-wrap:wrap}
.nav a{color:#effff2;text-decoration:none;background:#1c432a;border:1px solid #326b43;border-radius:9px;padding:9px 13px;font-size:13px;font-weight:700}
main{max-width:1000px;margin:0 auto;padding:64px 22px}
.eyebrow{color:#39c66b;font-size:12px;font-weight:900;letter-spacing:3px}
h1{font-size:clamp(42px,8vw,76px);line-height:1;margin:12px 0 18px;letter-spacing:-3px}
p{max-width:620px;color:#a9c6b0;font-size:17px}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,190px));gap:18px;margin-top:32px}
.game{aspect-ratio:1/1;display:flex;flex-direction:column;overflow:hidden;text-decoration:none;color:#effff2;background:#14251a;border:1px solid #2b5638;border-radius:12px}
.game:hover{border-color:#39c66b}
.game img{display:block;width:100%;height:72%;object-fit:contain;padding:8px;background:#203b28}
.game-info{padding:10px 13px;display:flex;flex-direction:column;justify-content:center;flex:1}
.name{font-size:17px;font-weight:800}
.tag{font-size:12px;color:#a9c6b0}
.player{display:none;margin-top:24px}
.player.active{display:block}
.player-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.player-head h2{margin:0;font-size:clamp(18px,3vw,25px)}
.back{display:inline-flex;align-items:center;gap:8px;color:#effff2;background:#1c432a;border:1px solid #39c66b;border-radius:8px;padding:10px 15px;text-decoration:none;font:700 14px system-ui;cursor:pointer}
.game-frame{display:block;width:100%;height:min(78vh,820px);min-height:420px;border:1px solid #326b43;border-radius:10px;background:#000}
@media(max-width:520px){header{align-items:flex-start;flex-direction:column}main{padding:36px 16px}.game-frame{min-height:360px;height:68vh}}
</style>
</head>
<body>
<header>
<a class="brand" href="index.html">TALLMII GAMES</a>
<nav class="nav"><a href="index.html">Games</a><a href="n64hub.html">N64Hub</a><a href="roms.html">ROMs</a></nav>
</header>
<main>
<div id="library">
<div class="eyebrow">TALLMII GAMES PRESENTS</div>
<h1>N64Hub</h1>
<p>Your Nintendo 64 corner. Pick a game below to jump in.</p>
<section aria-label="Nintendo 64 games">
<div class="games">
<a class="game" href="mario.html" data-game="Super Mario 64" data-image="images/sm64.jpg"><img src="images/sm64.jpg" alt="Super Mario 64 game icon"><span class="game-info"><span class="name">Super Mario 64</span><span class="tag">Jump into the adventure</span></span></a>
<a class="game" href="#ocarina" id="oot-card" data-game="The Legend of Zelda: Ocarina of Time" data-image="images/oot.jpg"><img src="images/oot.jpg" alt="The Legend of Zelda: Ocarina of Time game icon"><span class="game-info"><span class="name">Ocarina of Time</span><span class="tag">Play inside N64Hub</span></span></a>
</div>
</section>
</div>
<section class="player" id="oot-player" aria-label="Ocarina of Time player">
<div class="player-head"><h2>The Legend of Zelda: Ocarina of Time</h2><button class="back" id="oot-back" type="button">← Back to N64Hub</button></div>
<iframe class="game-frame" id="oot-frame" title="The Legend of Zelda: Ocarina of Time" allow="cross-origin-isolated; fullscreen; gamepad; autoplay" allowfullscreen></iframe>
</section>
</main>
<script>
const library=document.getElementById('library');
const players={
  oot:{section:document.getElementById('oot-player'),frame:document.getElementById('oot-frame'),card:document.getElementById('oot-card'),path:'oot-recomp/',hash:'#ocarina'}
};
function remember(card){
  try{
    const key='tallmiiRecentlyPlayed';
    let items=JSON.parse(localStorage.getItem(key)||'[]');
    items=[{name:card.dataset.game,url:location.href,image:card.dataset.image},...items.filter(item=>item.name!==card.dataset.game)].slice(0,8);
    localStorage.setItem(key,JSON.stringify(items));
  }catch(error){}
}
function openGame(name){
  const game=players[name];
  library.hidden=true;
  Object.entries(players).forEach(([key,item])=>{
    item.section.classList.toggle('active',key===name);
    if(key!==name){item.frame.src='about:blank';delete item.frame.dataset.loaded;}
  });
  if(game.frame.dataset.loaded!=='true'){game.frame.src=game.path;game.frame.dataset.loaded='true';}
  history.pushState({game:name},'',game.hash);
  remember(game.card);
  window.scrollTo(0,0);
}
function closePlayers(){
  Object.values(players).forEach(game=>{
    game.section.classList.remove('active');
    game.frame.src='about:blank';
    delete game.frame.dataset.loaded;
  });
  library.hidden=false;
  window.scrollTo(0,0);
}
players.oot.card.addEventListener('click',event=>{event.preventDefault();openGame('oot')});
document.getElementById('oot-back').addEventListener('click',()=>{if(location.hash==='#ocarina')history.back();else closePlayers()});
window.addEventListener('popstate',closePlayers);
document.querySelectorAll('a[data-game]:not(#oot-card)').forEach(link=>{
  link.addEventListener('click',()=>remember(link));
});
</script>
</body>
</html>
