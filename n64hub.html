<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123b25"><title>N64Hub · Tallmii Games</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0b160e;color:#effff2;font:15px/1.5 system-ui,Segoe UI,sans-serif}header{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 22px;background:#14251a;border-bottom:1px solid #2b5638}.brand{font-weight:900;letter-spacing:1px;color:#effff2;text-decoration:none}.nav{display:flex;gap:9px;flex-wrap:wrap}.nav a{color:#effff2;text-decoration:none;background:#1c432a;border:1px solid #326b43;border-radius:9px;padding:9px 13px;font-size:13px;font-weight:700}main{max-width:1000px;margin:0 auto;padding:64px 22px}.eyebrow{color:#39c66b;font-size:12px;font-weight:900;letter-spacing:3px}h1{font-size:clamp(42px,8vw,76px);line-height:1;margin:12px 0 18px;letter-spacing:-3px}p{max-width:620px;color:#a9c6b0;font-size:17px}.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,190px));gap:18px;margin-top:32px}.game{aspect-ratio:1/1;display:flex;flex-direction:column;overflow:hidden;text-decoration:none;color:#effff2;background:#14251a;border:1px solid #2b5638;border-radius:12px}.game:hover{border-color:#39c66b}.game img{display:block;width:100%;height:72%;object-fit:contain;padding:8px;background:#203b28}.game-info{padding:10px 13px;display:flex;flex-direction:column;justify-content:center;flex:1}.name{font-size:17px;font-weight:800}.tag{font-size:12px;color:#a9c6b0}@media(max-width:520px){header{align-items:flex-start;flex-direction:column}}</style></head>

<script>document.querySelectorAll('a[data-game]').forEach(a=>a.addEventListener('click',()=>{try{const key='tallmiiRecentlyPlayed';let list=JSON.parse(localStorage.getItem(key)||'[]');list=[{name:a.dataset.game,url:a.href,image:a.dataset.image},...list.filter(x=>x.name!==a.dataset.game)].slice(0,8);localStorage.setItem(key,JSON.stringify(list))}catch(e){}}));</script></body></html>
